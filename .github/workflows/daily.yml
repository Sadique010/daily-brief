name: Daily Brief
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-brief
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write Gmail token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: printf '%s' "$GMAIL_TOKEN_JSON" > token.json
      - name: Process yesterday's email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_BRIEF_PASSPHRASE: ${{ secrets.DAILY_BRIEF_PASSPHRASE }}
        run: python src/main.py
      - name: Commit encrypted data
        run: |
          rm -f token.json
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Brief $(date -u +%F)"
          git pull --rebase
          git push
